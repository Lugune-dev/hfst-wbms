services:
  # ==========================================================
  # 1. Main Application Service (Nginx + PHP 8.3 FPM + Supervisor)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hfst-wbms:latest
    container_name: hfst-wbms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: "${APP_NAME:-HFST-WBMS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:VIldUajE5pmMU/R/OIQ6PECrotQVSmq9E2vWfWi8MXQ=}"
      APP_URL: "${APP_URL:-http://localhost:8001}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DOCKER_DB_HOST:-postgres}"
      DB_PORT: "${DOCKER_DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-migration_pg}"
      DB_USERNAME: "${DB_USERNAME:-migration_user}"
      DB_PASSWORD: "${DB_PASSWORD:-MigrationTemp2026!}"
      DB_SCHEMA: "${DB_SCHEMA:-migration_db}"
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      QUEUE_CONNECTION: sync
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - hfst-network

  # ==========================================================
  # 2. PostgreSQL Database Service
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: hfst-wbms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-migration_pg}"
      POSTGRES_USER: "${DB_USERNAME:-migration_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-MigrationTemp2026!}"
    ports:
      # Port 5433 on host avoids conflict if host runs PostgreSQL on 5432
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-migration_user} -d ${DB_DATABASE:-migration_pg}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hfst-network

  # ==========================================================
  # 3. Redis Cache Service
  # ==========================================================
  redis:
    image: redis:alpine
    container_name: hfst-wbms-redis-service
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Port 6380 on host avoids conflict with existing container on 6379
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - hfst-network

  # ==========================================================
  # 4. Optional Database Web GUI (Adminer - supports PostgreSQL & MySQL)
  # ==========================================================
  adminer:
    image: adminer:latest
    container_name: hfst-wbms-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    networks:
      - hfst-network

volumes:
  app_storage:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hfst-network:
    driver: bridge
